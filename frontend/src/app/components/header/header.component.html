<mat-toolbar class="app-header">
  <a class="brand" [routerLink]="'/'">
    <mat-icon>home</mat-icon>
    <span>Find Me Home</span>
  </a>

  <nav class="nav-links">
    <a mat-button [routerLink]="'/allProperties'">Rent</a>
    <a mat-button [routerLink]="'/'">PG / Hostel</a>
    @if (role === 'owner') {
      <a mat-button [routerLink]="'/myProperties'">My Properties</a>
    }
    @if (id) {
      <a mat-button [routerLink]="['/my-chats', id]">My Chats</a>
    }
    @if (id) {
      <a mat-button [routerLink]="'/profile'">Profile</a>
    }
    @if (role === 'owner') {
      <a mat-button [routerLink]="'/addProperty'">List Property</a>
    }
    @if (role !== 'owner') {
      <a mat-button [routerLink]="'/addProperty'">List Property</a>
    }
  </nav>

  <span class="spacer"></span>

  <div class="auth-actions">
    @if (!id) {
      <a mat-stroked-button [routerLink]="'/login'">Log in</a>
    }
    @if (!id) {
      <a mat-flat-button [routerLink]="'/signUp'">Sign up</a>
    }
    @if (id) {
      <button mat-flat-button (click)="logoutFromHeader()">Logout</button>
    }
  </div>
</mat-toolbar>
